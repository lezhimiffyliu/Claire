# Alembic configuration for Claire's Postgres persistence layer.
# The database URL is taken from the DATABASE_URL env var at runtime
# (see alembic/env.py), so no secrets live in this file.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os
# sqlalchemy.url is injected from DATABASE_URL in alembic/env.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
